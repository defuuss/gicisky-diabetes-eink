blueprint:
  name: Waste collection e-ink schedule
  description: >-
    Render the next three waste collections from Waste Collection Schedule
    sensors on one or more 2.9-inch 296x128 BWR BLE ESL displays.
  domain: script
  input:
    eink_devices:
      name: E-ink displays
      selector:
        device:
          multiple: true
    waste_sensors:
      name: Waste-collection sensors
      description: Select sensors whose numeric state is the days until collection.
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    title:
      name: Display title
      default: Waste collection
      selector:
        text:

variables:
  waste_entities: !input waste_sensors
  display_title: !input title

sequence:
  - action: ble_esl.write_guarded
    target:
      device_id: !input eink_devices
    data:
      rotate: 0
      background: white
      payload:
        - type: text
          value: "{{ display_title }} · {{ now().strftime('%d %b') }}"
          x: 148
          y: 4
          anchor: mt
          size: 22
          color: black
          font: fonts/NotoSansKR-Bold.ttf
        - type: line
          x_start: 5
          y_start: 28
          x_end: 291
          y_end: 28
          width: 2
          fill: black
        - type: dlimg
          url: >-
            {% set candidates = namespace(items=[]) %}
            {% for entity in waste_entities %}
              {% set days = states(entity) | int(99) %}
              {% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}
            {% endfor %}
            {% set waste = candidates.items | sort %}
            {% set source = ((waste[0][1] ~ ' ' ~ state_attr(waste[0][1], 'friendly_name') | default('', true)) if waste | length > 0 else '') | lower %}
            {% if 'bio' in source or 'organic' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/organic.png
            {% elif 'valorlux' in source or 'packag' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/valorlux2.png
            {% elif 'recycl' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/recycle.png
            {% elif 'paper' in source or 'glass' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/paper.png
            {% else %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/waste.png{% endif %}
          x: 26
          y: 34
          xsize: 48
          ysize: 48
          anchor: mt
        - type: text
          value: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length > 0 %}{{ state_attr(waste[0][1], 'friendly_name') | default(waste[0][1], true) | truncate(15, true, '') }}{% else %}No collection{% endif %}
          x: 50
          y: 83
          anchor: mt
          size: 14
          color: black
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length == 0 %}—{% elif waste[0][0] == 0 %}Today{% elif waste[0][0] == 1 %}Tomorrow{% else %}In {{ waste[0][0] }}d{% endif %}
          x: 50
          y: 103
          anchor: mt
          size: 18
          color: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length > 0 and waste[0][0] <= 1 %}red{% else %}black{% endif %}
          font: fonts/NotoSansKR-Bold.ttf
        - type: line
          x_start: 99
          y_start: 33
          x_end: 99
          y_end: 124
          width: 1
          fill: gray
        - type: dlimg
          url: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% set source = ((waste[1][1] ~ ' ' ~ state_attr(waste[1][1], 'friendly_name') | default('', true)) if waste | length > 1 else '') | lower %}{% if 'bio' in source or 'organic' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/organic.png{% elif 'valorlux' in source or 'packag' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/valorlux2.png{% elif 'recycl' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/recycle.png{% elif 'paper' in source or 'glass' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/paper.png{% else %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/waste.png{% endif %}
          x: 124
          y: 34
          xsize: 48
          ysize: 48
          anchor: mt
        - type: text
          value: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length > 1 %}{{ state_attr(waste[1][1], 'friendly_name') | default(waste[1][1], true) | truncate(15, true, '') }}{% else %}—{% endif %}
          x: 148
          y: 83
          anchor: mt
          size: 14
          color: black
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length <= 1 %}—{% elif waste[1][0] == 0 %}Today{% elif waste[1][0] == 1 %}Tomorrow{% else %}In {{ waste[1][0] }}d{% endif %}
          x: 148
          y: 103
          anchor: mt
          size: 18
          color: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length > 1 and waste[1][0] <= 1 %}red{% else %}black{% endif %}
          font: fonts/NotoSansKR-Bold.ttf
        - type: line
          x_start: 197
          y_start: 33
          x_end: 197
          y_end: 124
          width: 1
          fill: gray
        - type: dlimg
          url: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% set source = ((waste[2][1] ~ ' ' ~ state_attr(waste[2][1], 'friendly_name') | default('', true)) if waste | length > 2 else '') | lower %}{% if 'bio' in source or 'organic' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/organic.png{% elif 'valorlux' in source or 'packag' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/valorlux2.png{% elif 'recycl' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/recycle.png{% elif 'paper' in source or 'glass' in source %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/paper.png{% else %}https://raw.githubusercontent.com/defuuss/home-assistant-eink-blueprints/main/assets/waste/waste.png{% endif %}
          x: 222
          y: 34
          xsize: 48
          ysize: 48
          anchor: mt
        - type: text
          value: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length > 2 %}{{ state_attr(waste[2][1], 'friendly_name') | default(waste[2][1], true) | truncate(15, true, '') }}{% else %}—{% endif %}
          x: 246
          y: 83
          anchor: mt
          size: 14
          color: black
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: >-
            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length <= 2 %}—{% elif waste[2][0] == 0 %}Today{% elif waste[2][0] == 1 %}Tomorrow{% else %}In {{ waste[2][0] }}d{% endif %}
          x: 246
