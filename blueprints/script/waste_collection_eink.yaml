            {% set candidates = namespace(items=[]) %}{% for entity in waste_entities %}{% set days = states(entity) | int(99) %}{% if days >= 0 and days < 99 %}{% set candidates.items = candidates.items + [(days, entity)] %}{% endif %}{% endfor %}{% set waste = candidates.items | sort %}{% if waste | length > 2 and waste[2][0] <= 1 %}red{% else %}black{% endif %}
          font: fonts/NotoSansKR-Bold.ttf
