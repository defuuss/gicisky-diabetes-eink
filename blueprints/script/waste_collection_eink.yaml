blueprint:
  name: Waste collection e-ink schedule
  description: >-
    Render the next three waste collections from Waste Collection Schedule
    sensors on one or more 2.9-inch 296x128 BWR BLE ESL displays.
  domain: script
  input:
    eink_devices:
      name: E-ink displays
      description: Select one or more BLE ESL displays.
      selector:
        device:
          multiple: true
    waste_sensors:
      name: Waste-collection sensors
      description: >-
        Select one or more sensors whose numeric state is the number of days
        until collection. Sensors from the Waste Collection Schedule integration
        work directly.
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    title:
      name: Display title
      default: Waste collection
      selector:
        text:

variables:
  waste_entities: !input waste_sensors
  display_title: !input title

sequence:
  # Guarded writes coalesce sensor updates and skip unchanged frames when the
  # BLE ESL integration's Prevent Duplicate Send option is enabled.
  - action: ble_esl.write_guarded
    target:
      device_id: !input eink_devices
    data:
      rotate: 0
      background: white
      payload:
        - type: text
          value: "{{ display_title }} · {{ now().strftime('%d %b') }}"
          x: 148
          y: 4
          anchor: mt
          size: 22
          color: black
          font: fonts/NotoSansKR-Bold.ttf
        - type: line
          x_start: 5
          y_start: 28
          x_end: 291
          y_end: 28
          width: 2
          fill: black
        - type: icon
          value: >-
            {% set items = namespace(value=[]) %}
            {% for entity_id in waste_entities %}
              {% set days = states(entity_id) | int(99) %}
              {% if days >= 0 and days < 99 %}
                {% set items.value = items.value + [(days, entity_id)] %}
              {% endif %}
            {% endfor %}
            {% set waste = items.value | sort %}
            {% if waste | length > 0 %}
              {{ state_attr(waste[0][1], 'icon') | default('mdi:trash-can', true) | replace('mdi:', '') }}
            {% else %}trash-can{% endif %}
          x: 50
          y: 38
          anchor: mt
          size: 34
          color: black
        - type: text
          value: >-
            {% set items = namespace(value=[]) %}
            {% for entity_id in waste_entities %}
              {% set days = states(entity_id) | int(99) %}
              {% if days >= 0 and days < 99 %}
                {% set items.value = items.value + [(days, entity_id)] %}
              {% endif %}
            {% endfor %}
            {% set waste = items.value | sort %}
            {% if waste | length > 0 %}
              {{ state_attr(waste[0][1], 'friendly_name') | default(waste[0][1], true) | truncate(15, true, '') }}
            {% else %}No collection{% endif %}
          x: 50
          y: 77
          anchor: mt
          size: 14
          color: black
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: >-
            {% set items = namespace(value=[]) %}
            {% for entity_id in waste_entities %}
              {% set days = states(entity_id) | int(99) %}
              {% if days >= 0 and days < 99 %}
                {% set items.value = items.value + [(days, entity_id)] %}
              {% endif %}
            {% endfor %}
            {% set waste = items.value | sort %}
            {% if waste | length == 0 %}—
            {% elif waste[0][0] == 0 %}Today
            {% elif waste[0][0] == 1 %}Tomorrow
            {% else %}In {{ waste[0][0] }}d{% endif %}
          x: 50
          y: 101
          anchor: mt
          size: 20
          color: >-
            {% set items = namespace(value=[]) %}
            {% for entity_id in waste_entities %}
              {% set days = states(entity_id) | int(99) %}
              {% if days >= 0 and days < 99 %}
                {% set items.value = items.value + [(days, entity_id)] %}
              {% endif %}
            {% endfor %}
            {% set waste = items.value | sort %}
            {% if waste | length > 0 and waste[0][0] <= 1 %}red{% else %}black{% endif %}
          font: fonts/NotoSansKR-Bold.ttf
        - type: line
          x_start: 99
